name: 15-Minute Deal Tracker

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes
  workflow_dispatch:        # Allows manual testing

jobs:
  track-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests feedparser

      - name: Run Deal Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{8864579611:AAHXfBbUXvvbumfhZg0wWC0x1u5iGJX_Lrc}}
          TELEGRAM_CHAT_ID: ${{6340558223}}
        run: |
          python deal_tracker.py

      - name: Commit Updated Cache
        run: |
          git config --global user.name 'Deal Bot'
          git config --global user.email 'bot@github.com'
          git add sent_deals.json || true
          git commit -m "Update sent deals cache" || true
          git push || true
